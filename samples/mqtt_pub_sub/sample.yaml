tests:
  # Needs a real DUT, a live AP, and an MQTT broker reachable from it.
  mqtt_pub_sub.run:
    platform_allow:
      - mm6108_ekh05
      - mm8108_ekh05
    build_only: false
    build_on_all: false
    integration_platforms:
      - mm6108_ekh05
      - mm8108_ekh05
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Wi-Fi connected"
        - "net_dhcpv4: Received"
        - "net_mqtt: Connect completed"
        - "MQTT connected"
        - "Received message on topic twister/output"
        - "Wi-Fi disconnected"
    tags:
      - wifi
      - morsemicro
  mqtt_pub_sub.run.shield:
    platform_allow:
      - nucleo_u575zi_q
    build_only: false
    build_on_all: false
    extra_args: SHIELD=morsemicro_mmech08
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Wi-Fi connected"
        - "net_dhcpv4: Received"
        - "net_mqtt: Connect completed"
        - "MQTT connected"
        - "Received message on topic twister/output"
        - "Wi-Fi disconnected"
    tags:
      - shield
      - wifi
      - morse

  # Build-only companion: gives CI compile coverage for this sample without
  # needing a DUT/AP/MQTT broker.
  mqtt_pub_sub.build:
    platform_allow:
      - mm6108_ekh05
      - mm8108_ekh05
    build_only: true
    tags:
      - wifi
      - morsemicro
      - build-only

  mqtt_pub_sub.build.shield.mmech08.nucleo_u575zi_q:
    platform_allow:
      - nucleo_u575zi_q
    build_only: true
    extra_args: SHIELD=morsemicro_mmech08
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  mqtt_pub_sub.build.shield.mmech08.nucleo_h753zi:
    platform_allow:
      - nucleo_h753zi
    build_only: true
    extra_args: SHIELD=morsemicro_mmech08
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  mqtt_pub_sub.build.shield.mmech08.ek_ra6m5:
