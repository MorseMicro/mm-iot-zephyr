#
# Enables the zperf shell module for throughput/performance testing, and sizes
# the networking buffer pools up from prj.conf's defaults to sustain it.
#
# Usage: west build -- -DEXTRA_CONF_FILE=overlay-zperf.conf

CONFIG_NET_ZPERF=y

CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_DATA_SIZE=256
