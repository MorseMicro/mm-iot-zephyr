tests:
  porting_assistant.run:
    platform_allow:
      - mm6108_ekh05
      - mm8108_ekh05
    extra_args: CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    build_only: false
    build_on_all: false
    integration_platforms:
      - mm6108_ekh05
      - mm8108_ekh05
    harness: console
    harness_config:
      type: one_line
      regex:
        - "11 passed"
        - "0 failed"
    tags:
      - wifi
      - morsemicro

  porting_assistant.run.shield:
    platform_allow:
      - nucleo_u575zi_q
    build_only: false
    build_on_all: false
    extra_args:
      - SHIELD=morsemicro_mmech08
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    harness: console
    harness_config:
      type: one_line
      regex:
        - "11 passed"
        - "0 failed"
    tags:
      - shield
      - wifi
      - morsemicro

  # Build-only companion: gives CI compile coverage for this sample without
  # needing a DUT.
  porting_assistant.build:
    platform_allow:
      - mm6108_ekh05
      - mm8108_ekh05
    build_only: true
    extra_args: CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    tags:
      - wifi
      - morsemicro
      - build-only

  porting_assistant.build.shield.mmech08.nucleo_u575zi_q:
    platform_allow:
      - nucleo_u575zi_q
    build_only: true
    extra_args:
      - SHIELD=morsemicro_mmech08
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  porting_assistant.build.shield.mmech08.nucleo_h753zi:
    platform_allow:
      - nucleo_h753zi
    build_only: true
    extra_args:
      - SHIELD=morsemicro_mmech08
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  porting_assistant.build.shield.mmech08.ek_ra6m5:
    platform_allow:
      - ek_ra6m5
    build_only: true
    extra_args:
      - SHIELD=morsemicro_mmech08
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  porting_assistant.build.shield.mmech18.nucleo_u575zi_q:
    platform_allow:
      - nucleo_u575zi_q
    build_only: true
    extra_args:
      - SHIELD=morsemicro_mmech18
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  porting_assistant.build.shield.mmech18.nucleo_h753zi:
    platform_allow:
      - nucleo_h753zi
    build_only: true
    extra_args:
      - SHIELD=morsemicro_mmech18
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
    tags:
      - shield
      - wifi
      - morsemicro
      - build-only

  porting_assistant.build.shield.mmech18.ek_ra6m5:
    platform_allow:
      - ek_ra6m5
    build_only: true
    extra_args:
      - SHIELD=morsemicro_mmech18
      - CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
