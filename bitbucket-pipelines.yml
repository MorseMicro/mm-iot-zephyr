image: ubuntu:24.04

definitions:
  steps:
    - step: &check-todos
        name: Check TODO Format
        script:
          - apt-get update -qq && apt-get install -y -qq python3 git

          # Compute against merge base
          - BASE=$(git merge-base HEAD origin/${BITBUCKET_PR_DESTINATION_BRANCH})

          # Detect changed *.c and *.h files under subdirectory (drivers/ and samples/)
          - git diff "$BASE" HEAD -- 'drivers/**/*.c' 'drivers/**/*.h' 'samples/**/*.c' 'samples/**/*.h' > todo.diff

          - python3 scripts/ci/todo-checker.py -f todo.diff

    - step: &check-copyright
        name: Check copyright headers
        script:
          - apt-get update -qq && apt-get install -y -qq python3 git

          # Compute against merge base
          - BASE=$(git merge-base HEAD origin/${BITBUCKET_PR_DESTINATION_BRANCH})

          # Detect all files touched by the PR, excluding deletions and vendored trees
          - git diff --diff-filter=d --name-only "$BASE" HEAD -- . ':!submodules' ':!components' > touched-files.txt

          - python3 scripts/ci/copyright-checker.py -f touched-files.txt --blocklist scripts/ci/copyright-blocklist.txt

    - step: &clang-format-check
        name: clang-format check
        script:
          - apt-get update -qq && apt-get install -y -qq clang-format-20 git

          # Compute against merge base
          - BASE=$(git merge-base HEAD origin/${BITBUCKET_PR_DESTINATION_BRANCH})

          # Detect changed *.c and *.h files under subdirectory (drivers/ and samples/)
          - FILES=$(git diff --name-only "$BASE" HEAD -- 'drivers/**/*.c' 'drivers/**/*.h' 'samples/**/*.c' 'samples/**/*.h')

          - |
            if [ -z "$FILES" ]; then
              echo "No C/H file changes in target directories."
              exit 0
            fi

          # Run git-clang-format in diff mode
          - echo "Files to check:" && echo "$FILES"
          - git-clang-format-20 --binary clang-format-20 --diff "$BASE" HEAD -- $FILES

    - step: &cmake-format-check
        name: cmake-format check
        script:
          - apt-get update -qq && apt-get install -y -qq python3-pip git
          - pip install --break-system-packages --quiet cmake-format==0.6.13 pyyaml

          # Compute against merge base
          - BASE=$(git merge-base HEAD origin/${BITBUCKET_PR_DESTINATION_BRANCH})

          # Detect changed CMakeLists.txt / *.cmake files under subdirectories of interest
          - FILES=$(git diff --name-only "$BASE" HEAD -- 'CMakeLists.txt' 'drivers/**/CMakeLists.txt' 'drivers/**/*.cmake' 'samples/**/CMakeLists.txt' 'samples/**/*.cmake' 'components/**/CMakeLists.txt' 'components/**/*.cmake' 'boards/**/CMakeLists.txt' 'boards/**/*.cmake')

          - |
            if [ -z "$FILES" ]; then
              echo "No CMake file changes in target directories."
              exit 0
            fi

          # NOTE: file paths must precede -c/--config-files — cmake-format's
          # nargs='+' greedily consumes trailing args otherwise (silent false pass).
          - echo "Files to check:" && echo "$FILES"
          - cmake-format --check $FILES -c .cmake-format.yaml

pipelines:
  pull-requests:
    "**":
      - step: *check-todos
      - step: *check-copyright
      - step: *clang-format-check
      - step: *cmake-format-check
