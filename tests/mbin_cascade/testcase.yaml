common:
  filter: dt_compat_enabled("morsemicro,mm6108") or
          dt_compat_enabled("morsemicro,mm8108")
  extra_args:
    - CONF_FILE=${ZEPHYR_MORSEMICRO_MODULE_DIR}/tests/prj.conf

tests:
  net.wifi.halow.pytest.mbin.direct:
    build_only: true
    harness: pytest
    platform_allow:
      - mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_REGION="ZZ"
    tags:
      - wifi
      - net
      - halow

  net.wifi.halow.pytest.mbin.local:
    build_only: true
    harness: pytest
    platform_allow:
      - nucleo_u575zi_q
    extra_args:
      - CONFIG_WIFI_MORSEMICRO_REGION="ZZ"
      - SHIELD="morsemicro_mmech18"
