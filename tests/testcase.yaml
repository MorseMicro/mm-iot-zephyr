common:
  filter: dt_compat_enabled("morsemicro,mm6108") or
          dt_compat_enabled("morsemicro,mm8108")
tests:
  # On-hardware functional suite: needs a real DUT, and for most cases a
  # real AP (HALOW_TEST_SSID/HALOW_TEST_PSK). See tests/pytest/.
  net.wifi.halow.pytest: &base_halow_pytest
    harness: pytest
    harness_config: &base_harness_config
      # flash once per session; conftest.py reboots between tests instead
      pytest_dut_scope: session
    timeout: 180
    integration_platforms:
      - mm6108_ekh05
      - mm8108_ekh05
    tags:
      - wifi
      - net
      - halow
  # the below are duplicates of the above using fixtures to target platforms
  # which use specific shields. Note that these are more targeted using platform_allow
  # when compared to the above as:
  # - twister will automatically attempt to build these on platforms without appropriate
  #   nexus nodes defined
  # - the above tests cover the compilation smoke tests across platforms we don't have
  #   explicit platforms for.
  # A platform selector in extra_args could also have been used instead, but that would result
  # in many duplicated builds.
  net.wifi.halow.mmech08.pytest:
    <<: *base_halow_pytest
    harness_config:
      <<: *base_harness_config
      fixture: mmech08
    integration_platforms: &mmech08_platforms
      - nrf5340dk/nrf5340/cpuapp
      - nucleo_h753zi
      - nucleo_u575zi_q
    platform_allow: *mmech08_platforms
    extra_args:
      - SHIELD=morsemicro_mmech08
  net.wifi.halow.mmech18.pytest:
    <<: *base_halow_pytest
    harness_config:
      <<: *base_harness_config
      fixture: mmech18
    integration_platforms: &mmech18_platforms
      - nrf5340dk/nrf5340/cpuapp
      - nucleo_h753zi
      - nucleo_u575zi_q
    platform_allow: *mmech18_platforms
    extra_args:
      - SHIELD=morsemicro_mmech18
  net.wifi.halow.xiao_fgh100mhaamd.pytest:
    <<: *base_halow_pytest
    harness_config:
      <<: *base_harness_config
      fixture: xiao_fgh100mhaamd
    integration_platforms: &xiao_fgh100mhaamd_platforms
      - xiao_esp32s3/esp32s3/procpu
      - xiao_esp32c6/esp32c6/hpcore
      - xiao_esp32c3
    platform_allow: *xiao_fgh100mhaamd_platforms
    extra_args:
      - SHIELD=xiao_fgh100mhaamd

  # --- Build-only compile matrix ---------------------------------------
  # No DUT required. Confirms every board/PM-variant/Kconfig combination
  # this driver supports actually compiles, mirroring the vendor-owned
  # build_only pattern upstream uses for other Wi-Fi drivers (e.g.
  # zephyr/tests/drivers/wifi/nrf_wifi).
  drivers.wifi.morsemicro.build.mm6108_ekh05:
    build_only: true
    platform_allow: mm6108_ekh05
    integration_platforms:
      - mm6108_ekh05
    tags: [wifi, halow, build, spi]

  drivers.wifi.morsemicro.build.mm6108_ekh05_pm:
    build_only: true
    platform_allow: mm6108_ekh05/stm32u585xx/pm
    tags: [wifi, halow, build, spi]

  drivers.wifi.morsemicro.build.mm8108_ekh05:
    build_only: true
    platform_allow: mm8108_ekh05
    integration_platforms:
      - mm8108_ekh05
    tags: [wifi, halow, build, spi]

  drivers.wifi.morsemicro.build.mm8108_ekh05_pm:
    build_only: true
    platform_allow: mm8108_ekh05/stm32u585xx/pm
    tags: [wifi, halow, build, spi]

  drivers.wifi.morsemicro.build.mm6108_ekh05_sdio:
    build_only: true
    platform_allow: mm6108_ekh05/stm32u585xx/sdio
    integration_platforms:
      - mm6108_ekh05
    tags: [wifi, halow, build, sdio]
    extra_args:
      # ST's SDHC driver emits warnings
      - "EXTRA_CFLAGS=-Wno-error=unused-function -Wno-error=unused-variable"

  drivers.wifi.morsemicro.build.mm6108_ekh05_sdio_pm:
    build_only: true
    platform_allow: mm6108_ekh05/stm32u585xx/sdio/pm
    tags: [wifi, halow, build, sdio]
    extra_args:
      # ST's SDHC driver emits warnings
      - "EXTRA_CFLAGS=-Wno-error=unused-function -Wno-error=unused-variable"

  drivers.wifi.morsemicro.build.mm8108_ekh05_sdio:
    build_only: true
    platform_allow: mm8108_ekh05/stm32u585xx/sdio
    integration_platforms:
      - mm8108_ekh05
    tags: [wifi, halow, build, sdio]
    extra_args:
      # ST's SDHC driver emits warnings
      - "EXTRA_CFLAGS=-Wno-error=unused-function -Wno-error=unused-variable"

  drivers.wifi.morsemicro.build.mm8108_ekh05_sdio_pm:
    build_only: true
    platform_allow: mm8108_ekh05/stm32u585xx/sdio/pm
    tags: [wifi, halow, build, sdio]
    extra_args:
      # ST's SDHC driver emits warnings
      - "EXTRA_CFLAGS=-Wno-error=unused-function -Wno-error=unused-variable"

  # --- Regulatory region matrix -----------------------------------------
  # CONFIG_WIFI_MORSEMICRO_REGION is validated at CMake-configure time
  # (drivers/wifi/morsemicro/CMakeLists.txt: FATAL_ERROR on anything
  # outside this list). One representative board is enough since the
  # region logic is chip-independent; AU is already covered by the
  # default config in the entries above.
  drivers.wifi.morsemicro.build.region.eu:
    build_only: true
    platform_allow: mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_REGION="EU"
    tags: [wifi, halow, build]

  drivers.wifi.morsemicro.build.region.jp:
    build_only: true
    platform_allow: mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_REGION="JP"
    tags: [wifi, halow, build]

  drivers.wifi.morsemicro.build.region.us:
    build_only: true
    platform_allow: mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_REGION="US"
    tags: [wifi, halow, build]

  # --- AU channelisation matrix ------------------------------------------
  # REVMF is the Kconfig default and already covered above.
  drivers.wifi.morsemicro.build.au_channelisation.2020:
    build_only: true
    platform_allow: mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_AU_CHANNELISATION_2020=y
    tags: [wifi, halow, build]

  drivers.wifi.morsemicro.build.au_channelisation.2024:
    build_only: true
    platform_allow: mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_AU_CHANNELISATION_2024=y
    tags: [wifi, halow, build]

  # --- Other Kconfig variants ---------------------------------------------
  # WIFI_MORSEMICRO_TEST disables netif registration for HAL-only bring-up
  # testing (see samples/porting_assistant); confirm that mode builds too.
  drivers.wifi.morsemicro.build.test_driver:
    build_only: true
    platform_allow: mm8108_ekh05
    extra_configs:
      - CONFIG_WIFI_MORSEMICRO_TEST=y
    tags: [wifi, halow, build]

  # --- Shield / host-board matrix -----------------------------------------
  # Both shields on every host overlay morsemicro ships, so a build
  # regression on any host is caught without needing that hardware.
  drivers.wifi.morsemicro.build.shield.mmech08.nucleo_u575zi_q:
    build_only: true
    platform_allow: nucleo_u575zi_q
    extra_args: SHIELD=morsemicro_mmech08
    tags: [wifi, halow, build, shield]

  drivers.wifi.morsemicro.build.shield.mmech08.nucleo_h753zi:
    build_only: true
    platform_allow: nucleo_h753zi
    extra_args: SHIELD=morsemicro_mmech08
    tags: [wifi, halow, build, shield]

  drivers.wifi.morsemicro.build.shield.mmech08.ek_ra6m5:
    build_only: true
    platform_allow: ek_ra6m5
    extra_args: SHIELD=morsemicro_mmech08
    tags: [wifi, halow, build, shield]

  drivers.wifi.morsemicro.build.shield.mmech18.nucleo_u575zi_q:
    build_only: true
    platform_allow: nucleo_u575zi_q
    extra_args: SHIELD=morsemicro_mmech18
    tags: [wifi, halow, build, shield]

  drivers.wifi.morsemicro.build.shield.mmech18.nucleo_h753zi:
    build_only: true
    platform_allow: nucleo_h753zi
    extra_args: SHIELD=morsemicro_mmech18
    tags: [wifi, halow, build, shield]

  drivers.wifi.morsemicro.build.shield.mmech18.ek_ra6m5:
    build_only: true
    platform_allow: ek_ra6m5
    extra_args: SHIELD=morsemicro_mmech18
    tags: [wifi, halow, build, shield]
