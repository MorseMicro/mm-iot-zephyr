description: Morse Micro Wi-Fi HaLow SoftMAC peripheral

properties:

  resetn-gpios:
    type: phandle-array
    required: true
    description: Logic low pin for resetting the chip.

  wakeup-gpios:
    type: phandle-array
    description: Line for communicating when the host has data for the chip.

  busy-gpios:
    type: phandle-array
    description: Line for communicating when chip has data for the host.
